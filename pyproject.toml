[project]
name = "repotainer"
version = "0.0.1"
description = "Generate reproducible Dev Container configurations from repository files"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Suchi Pragya", email = "suchipragya612@gmail.com" }]
dependencies = [
  "typer>=0.27.2",
]

[project.scripts]
repotainer = "repotainer.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
