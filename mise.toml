[tools]
gitleaks = "latest"
prek = "latest"
ruff = "latest"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
ty = "latest"
uv = "latest"

[settings]
experimental = true
lockfile = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh", run_windows = "" }

[env]
_.file = ".env"  # for sensitive data

[shell_alias]
pya = "source ./.venv/bin/activate"

[tasks.docs]
run = "uvx zensical serve"
description = "Serve the documentation locally"

[tasks.install-cli]
run = "uv tool install --editable ."
description = "Install the local Repotainer CLI for use from any directory"

[tasks.sync]
run = "uv sync --upgrade"
description = "Sync and upgrade packages"
